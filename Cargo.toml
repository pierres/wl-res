[package]
name = "wl-res"
version = "0.1.3"
edition = "2024"
description = "Wayland CLI for printing the primary display's resolution, with aspect-ratio fitting"
license = "MIT"

[dependencies]
rustix = { version = "1", features = ["event"] }
wayland-client = "0.31"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
